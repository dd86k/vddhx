name: CI

# Any branch allows testing before putting on main branch
on: [ push, pull_request, workflow_dispatch ]

permissions:
  contents: read

# NOTE: Pinning
#       Pin commits instead of relying on tag

jobs:
  # Test project tests and builds OK
  test:
    strategy:
      # This allows other tests to run even on failure
      fail-fast: false
      matrix:
        include: # easier to maintain, more explicit
          # DMD: Currently x86-only
          # GDC: Works best on Linux, BSDs
          # NOTE: setup-dlang grabs gdc from repo, dmd/ldc always latest
          # Windows
          - { os: windows-2025, dc: dmd }
          - { os: windows-11-arm, dc: ldc }
          # macOS
          - { os: macos-26, dc: ldc }
          - { os: macos-26-intel, dc: ldc }
          # Linux
          - { os: ubuntu-26.04, dc: ldc }
          - { os: ubuntu-26.04-arm, dc: ldc }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup D compiler
      uses: dlang-community/setup-dlang@a6f7969b8b5dc3ff448c30f2c6749150795814f3 # v2 branch
      with:
        compiler: ${{ matrix.dc }}
    - name: Unit tests
      run: dub test
    # Makes sure binary runs even if tests are passing
    - name: Compile and run
      run: dub run -- --version

  # Each format is built on its own distro family so dpkg-shlibdeps and rpmbuild
  # pick up glibc requirements users actually have (see tools/package.d).
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, arch: amd64 }
          - { os: ubuntu-26.04-arm, arch: arm64 }
    needs: test
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # The default configuration dlopens SDL3, so no SDL dev packages needed.
    - name: Install packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev
    - uses: dlang-community/setup-dlang@a6f7969b8b5dc3ff448c30f2c6749150795814f3 # v2 branch
      with:
        compiler: ldc
    # dub.selections.json is gitignored; dub.sdl pins every dependency.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.dub
        key: dub-${{ matrix.os }}-${{ hashFiles('dub.sdl') }}
    - name: Build .deb
      run: ldc2 -run tools/package.d --deb --compiler=ldc2
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vddhx-deb-${{ matrix.arch }}
        path: dist/*.deb
        if-no-files-found: error

  rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, arch: x86_64 }
          - { os: ubuntu-26.04-arm, arch: aarch64 }
    needs: test
    runs-on: ${{ matrix.os }}
    container: fedora:latest
    steps:
    # git for dub's git dependencies, tar for actions/cache, binutils for strip.
    - name: Install toolchain and packaging tools
      run: dnf install -y ldc dub git tar binutils rpm-build
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.dub
        key: dub-fedora-${{ matrix.os }}-${{ hashFiles('dub.sdl') }}
    - name: Build .rpm
      run: ldc2 -run tools/package.d --rpm --compiler=ldc2
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vddhx-rpm-${{ matrix.arch }}
        path: dist/*.rpm
        if-no-files-found: error

  # Static, built on the oldest glibc worth supporting (Rocky 9: 2.34), so the
  # image runs on any newer distro. Tool downloads are pinned by hash.
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86_64
            ldc-sha256: 35805db60f47fd1a162b2035da84d96beec37e6d1e7b1edf60498a90acfaedce
            tool-sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime-sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - os: ubuntu-26.04-arm
            arch: aarch64
            ldc-sha256: f2b24edc254d4b9944234f641de3c4b3a36d5752639ec30cb2bbe122931b2283
            tool-sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime-sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    needs: test
    runs-on: ${{ matrix.os }}
    # The Docker Hub "rockylinux" library image stopped at 9.3.
    container: rockylinux/rockylinux:9
    env:
      LDC: 1.43.0
      APPIMAGETOOL: 1.9.1
      RUNTIME: 20251108
      # No FUSE in the container; appimagetool is an AppImage itself.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
    # git for dub, gcc to link build-sdl3.d before it installs the rest, file
    # for appimagetool, binutils for strip.
    - name: Install bootstrap tools
      run: dnf install -y git tar xz gcc binutils file
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # setup-dlang is untested in this container; the official tarball targets an
    # old glibc and runs as is. Unpacked into /usr/local rather than added through
    # GITHUB_PATH: this image declares no PATH, so the runner would replace PATH
    # with the added directory alone.
    - name: Install LDC and appimagetool
      run: |
        curl -fsSLo ldc.tar.xz "https://github.com/ldc-developers/ldc/releases/download/v$LDC/ldc2-$LDC-linux-${{ matrix.arch }}.tar.xz"
        curl -fsSLo /usr/local/bin/appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL/appimagetool-${{ matrix.arch }}.AppImage"
        curl -fsSLo "$RUNNER_TEMP/runtime" "https://github.com/AppImage/type2-runtime/releases/download/$RUNTIME/runtime-${{ matrix.arch }}"
        sha256sum -c <<EOF
        ${{ matrix.ldc-sha256 }}  ldc.tar.xz
        ${{ matrix.tool-sha256 }}  /usr/local/bin/appimagetool
        ${{ matrix.runtime-sha256 }}  $RUNNER_TEMP/runtime
        EOF
        tar -xJf ldc.tar.xz -C /usr/local --strip-components=1 && rm ldc.tar.xz
        chmod +x /usr/local/bin/appimagetool
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.dub
        key: dub-rocky9-${{ matrix.arch }}-${{ hashFiles('dub.sdl') }}
    # The static link needs only the archives, so a hit skips the dev packages.
    - id: sdl3
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local
        key: sdl3-rocky9-${{ matrix.arch }}-${{ hashFiles('tools/build-sdl3.d') }}
    - name: Build SDL3
      if: steps.sdl3.outputs.cache-hit != 'true'
      run: ldc2 -run tools/build-sdl3.d --enable-crb
    - name: Build AppImage
      run: ldc2 -run tools/package.d --appimage --compiler=ldc2 "--runtime=$RUNNER_TEMP/runtime"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vddhx-appimage-${{ matrix.arch }}
        path: dist/*.AppImage
        if-no-files-found: error

  # Static: SDL3 and SDL3_ttf are linked in, so the artifact is the exe alone.
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    needs: test
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dlang-community/setup-dlang@a6f7969b8b5dc3ff448c30f2c6749150795814f3 # v2 branch
      with:
        compiler: ldc
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/AppData/Local/dub
        key: dub-${{ matrix.os }}-${{ hashFiles('dub.sdl') }}
    # The script pins the SDL tags, so its hash decides when to rebuild.
    - id: sdl3
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: install
        key: sdl3-${{ matrix.os }}-${{ hashFiles('tools/build-sdl3.d') }}
    - name: Build SDL3
      if: steps.sdl3.outputs.cache-hit != 'true'
      run: ldc2 -run tools/build-sdl3.d
    - name: Build vddhx
      run: dub build -c static -b release --compiler=ldc2
    - name: Stage artifact
      shell: pwsh
      run: |
        New-Item -ItemType Directory stage | Out-Null
        Copy-Item vddhx.exe, LICENSE, README.md stage
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vddhx-windows-${{ matrix.arch }}
        path: stage/*
        if-no-files-found: error
